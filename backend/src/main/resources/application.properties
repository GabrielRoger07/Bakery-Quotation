spring.application.name=backend

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

api.security.token.secret=${JWT_SECRET}
api.security.token.company.expiration=86400
api.security.token.company.refresh-token.expiration=604800
api.security.token.supplier.expiration=7200
api.security.token.supplier.refresh-token.expiration=14400
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.pagination-size=10

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false